<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robotic Arm Dashboard</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #eef4f7;
            --panel: #ffffff;
            --ink: #16313f;
            --grid: #d5e2e8;
            --accent: #0f8b8d;
            --joint: #ff7f50;
            --grip-open: #2e8b57;
            --grip-closed: #d64550;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(circle at top, #ffffff 0%, #eef4f7 45%, #ddeaf0 100%);
            color: var(--ink);
        }

        .panel {
            position: relative;
            width: min(92vw, 760px);
            padding: 24px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 0 22px 60px rgba(22, 49, 63, 0.16);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.8rem;
        }

        p {
            margin: 0 0 18px;
            color: rgba(22, 49, 63, 0.78);
        }

        canvas {
            width: 100%;
            max-width: 600px;
            height: auto;
            display: block;
            margin: 0 auto 18px;
            border-radius: 16px;
            background:
                linear-gradient(180deg, #fbfdfe 0%, #edf5f8 100%);
            border: 1px solid #d7e4ea;
        }

        .readout {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
        }

        .card {
            padding: 12px 14px;
            border-radius: 14px;
            background: #f6fafc;
            border: 1px solid #d9e7ec;
        }

        .label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: rgba(22, 49, 63, 0.68);
        }

        .value {
            margin-top: 4px;
            font-size: 1.45rem;
            font-weight: 700;
        }

        .gripper-controls {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-end;
        }

        .gripper-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .gripper-actions button {
            border: 0;
            border-radius: 999px;
            padding: 8px 14px;
            font: inherit;
            cursor: pointer;
            background: var(--accent);
            color: #ffffff;
            box-shadow: 0 10px 20px rgba(15, 139, 141, 0.18);
        }

        .gripper-actions button:last-child {
            background: #31586a;
        }

        #gripStatus {
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(22, 49, 63, 0.08);
            font-size: 0.85rem;
            font-weight: 600;
        }

        @media (max-width: 640px) {
            .readout {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
    </style>
</head>
<body>
    <section class="panel">
        <div class="gripper-controls">
            <div class="gripper-actions">
                <button onclick="toggleGrip()">Toggle Grip</button>
                <button onclick="setAuto()">Auto Mode</button>
            </div>
            <div id="gripStatus">Mode: AUTO</div>
        </div>

        <h1>Gesture-Controlled Arm</h1>
        <p>Live digital twin driven by the latest servo state from the camera pipeline.</p>

        <canvas id="armCanvas" width="600" height="400"></canvas>

        <div class="readout">
            <div class="card">
                <div class="label">S1 Grip</div>
                <div class="value" id="s1Value">10</div>
            </div>
            <div class="card">
                <div class="label">S2 Elbow</div>
                <div class="value" id="s2Value">0</div>
            </div>
            <div class="card">
                <div class="label">S3 Shoulder</div>
                <div class="value" id="s3Value">0</div>
            </div>
            <div class="card">
                <div class="label">S4 Base</div>
                <div class="value" id="s4Value">0</div>
            </div>
        </div>
    </section>

    <script src="https://cdn.socket.io/4.0.1/socket.io.min.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById("armCanvas");
        const ctx = canvas.getContext("2d");
        const gripStatus = document.getElementById("gripStatus");
        const readouts = {
            s1: document.getElementById("s1Value"),
            s2: document.getElementById("s2Value"),
            s3: document.getElementById("s3Value"),
            s4: document.getElementById("s4Value")
        };
        const DEFAULT_CALIBRATION = {{ default_calibration|tojson }};
        const INITIAL_CALIBRATION = {{ initial_calibration|tojson }};
        const GRIPPER_OPEN = 10;
        const GRIPPER_CLOSED = 100;
        const latestState = {
            s1: GRIPPER_OPEN,
            s2: DEFAULT_CALIBRATION.s2_smin,
            s3: DEFAULT_CALIBRATION.s3_center,
            s4: DEFAULT_CALIBRATION.s4_center
        };

        window.calibration = { ...DEFAULT_CALIBRATION, ...INITIAL_CALIBRATION };

        const armLengths = {
            base: 55,
            upper: 110,
            forearm: 90,
            wrist: 45
        };

        function toRadians(deg) {
            return deg * Math.PI / 180;
        }

        function calibrationNumber(value, fallback) {
            const number = Number(value);
            return Number.isFinite(number) ? number : fallback;
        }

        function calibrationRange(minValue, maxValue, fallbackMin, fallbackMax) {
            let lower = calibrationNumber(minValue, fallbackMin);
            let upper = calibrationNumber(maxValue, fallbackMax);

            if (lower > upper) {
                [lower, upper] = [upper, lower];
            }

            if (lower === upper) {
                upper = lower + 1;
            }

            return { min: lower, max: upper };
        }

        function clamp(value, minValue, maxValue) {
            return Math.min(Math.max(value, minValue), maxValue);
        }

        function mapLinear(value, inputMin, inputMax, outputMin, outputMax) {
            if (inputMin === inputMax) {
                return outputMin;
            }

            return outputMin + ((value - inputMin) * (outputMax - outputMin)) / (inputMax - inputMin);
        }

        function getCalibration() {
            return window.calibration || DEFAULT_CALIBRATION;
        }

        function getElbowRanges() {
            const calibration = getCalibration();
            return {
                human: { min: 60, max: 180 },
                servo: calibrationRange(
                    calibration.s2_smin,
                    calibration.s2_smax,
                    DEFAULT_CALIBRATION.s2_smin,
                    DEFAULT_CALIBRATION.s2_smax
                )
            };
        }

        function getBaseCenter() {
            return calibrationNumber(getCalibration().s4_center, DEFAULT_CALIBRATION.s4_center);
        }

        function mapServoToHumanElbow(servoValue) {
            const { human, servo } = getElbowRanges();
            const clampedValue = clamp(calibrationNumber(servoValue, servo.min), servo.min, servo.max);
            return mapLinear(clampedValue, servo.min, servo.max, human.min, human.max);
        }

        function getShoulderCalibration() {
            const calibration = getCalibration();
            const center = calibrationNumber(calibration.s3_center, DEFAULT_CALIBRATION.s3_center);
            const max = calibrationNumber(calibration.s3_max, DEFAULT_CALIBRATION.s3_max);
            return {
                center,
                max: Math.max(max, center + 1)
            };
        }

        function mapServoToHumanShoulder(servoValue) {
            const shoulder = getShoulderCalibration();
            const clampedValue = clamp(
                calibrationNumber(servoValue, shoulder.center),
                shoulder.center,
                shoulder.max
            );

            return mapLinear(
                clampedValue,
                shoulder.center,
                shoulder.max,
                90,
                0
            );
        }

        function drawSegment(fromX, fromY, toX, toY, width, color) {
            ctx.beginPath();
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(toX, toY);
            ctx.lineWidth = width;
            ctx.lineCap = "round";
            ctx.strokeStyle = color;
            ctx.stroke();
        }

        function drawJoint(x, y, radius) {
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fillStyle = "#ff7f50";
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function drawGrid() {
            ctx.strokeStyle = "#d5e2e8";
            ctx.lineWidth = 1;

            for (let x = 40; x < canvas.width; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }

            for (let y = 40; y < canvas.height; y += 40) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }

        function updateReadout(state) {
            readouts.s1.textContent = state.s1;
            readouts.s2.textContent = state.s2;
            readouts.s3.textContent = state.s3;
            readouts.s4.textContent = state.s4;
        }

        function updateGripStatus(data) {
            const manualOverride = Boolean(data?.manual_override);
            gripStatus.innerText = `Mode: ${manualOverride ? "MANUAL" : "AUTO"}`;
        }

        function toggleGrip() {
            socket.emit("toggle_gripper");
            gripStatus.innerText = "Mode: MANUAL";
        }

        function setAuto() {
            socket.emit("auto_gripper");
            gripStatus.innerText = "Mode: AUTO";
        }

        function drawArm(state) {
            latestState.s1 = Number(state?.s1 ?? GRIPPER_OPEN);
            latestState.s2 = Number(state?.s2 ?? 0);
            latestState.s3 = Number(state?.s3 ?? 0);
            latestState.s4 = Number(state?.s4 ?? 0);

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();

            const basePivot = { x: canvas.width / 2, y: canvas.height - 55 };
            const humanElbow = mapServoToHumanElbow(latestState.s2);
            const humanShoulder = mapServoToHumanShoulder(latestState.s3);
            const baseAngle = toRadians(latestState.s4 - getBaseCenter());
            const shoulderAngle = baseAngle + toRadians(humanShoulder);
            const elbowAngle = shoulderAngle + toRadians(humanElbow - 180);

            const baseJoint = {
                x: basePivot.x + armLengths.base * Math.cos(baseAngle),
                y: basePivot.y - armLengths.base * Math.sin(baseAngle)
            };
            const elbowJoint = {
                x: baseJoint.x + armLengths.upper * Math.cos(shoulderAngle),
                y: baseJoint.y - armLengths.upper * Math.sin(shoulderAngle)
            };
            const wristJoint = {
                x: elbowJoint.x + armLengths.forearm * Math.cos(elbowAngle),
                y: elbowJoint.y - armLengths.forearm * Math.sin(elbowAngle)
            };
            const handAngle = elbowAngle;
            const wristTip = {
                x: wristJoint.x + armLengths.wrist * Math.cos(handAngle),
                y: wristJoint.y - armLengths.wrist * Math.sin(handAngle)
            };

            ctx.fillStyle = "#16313f";
            ctx.fillRect(basePivot.x - 28, basePivot.y, 56, 26);

            drawSegment(basePivot.x, basePivot.y, baseJoint.x, baseJoint.y, 16, "#0f8b8d");
            drawSegment(baseJoint.x, baseJoint.y, elbowJoint.x, elbowJoint.y, 14, "#197278");
            drawSegment(elbowJoint.x, elbowJoint.y, wristJoint.x, wristJoint.y, 12, "#2d5f73");
            drawSegment(wristJoint.x, wristJoint.y, wristTip.x, wristTip.y, 8, "#3e8b8f");

            const gripColor = latestState.s1 > 90 ? "#d64550" : "#2e8b57";
            const gripSpread = latestState.s1 > 90
                ? 10
                : mapLinear(latestState.s1, GRIPPER_OPEN, GRIPPER_CLOSED, 22, 10);
            const upperFingerAngle = handAngle + toRadians(gripSpread);
            const lowerFingerAngle = handAngle - toRadians(gripSpread);
            const fingerLength = 28;

            drawSegment(
                wristTip.x,
                wristTip.y,
                wristTip.x + fingerLength * Math.cos(upperFingerAngle),
                wristTip.y - fingerLength * Math.sin(upperFingerAngle),
                5,
                gripColor
            );
            drawSegment(
                wristTip.x,
                wristTip.y,
                wristTip.x + fingerLength * Math.cos(lowerFingerAngle),
                wristTip.y - fingerLength * Math.sin(lowerFingerAngle),
                5,
                gripColor
            );

            drawJoint(basePivot.x, basePivot.y, 12);
            drawJoint(baseJoint.x, baseJoint.y, 10);
            drawJoint(elbowJoint.x, elbowJoint.y, 9);
            drawJoint(wristJoint.x, wristJoint.y, 8);
            drawJoint(wristTip.x, wristTip.y, 6);

            updateReadout(latestState);
        }

        socket.on("update", data => {
            drawArm(data);
            updateGripStatus(data);
        });

        socket.on("gripper_mode", data => {
            updateGripStatus(data);
        });

        socket.on("calibration_update", config => {
            window.calibration = { ...DEFAULT_CALIBRATION, ...(config || {}) };
            drawArm(latestState);
        });

        socket.emit("request_calibration");

        updateGripStatus({ manual_override: false });
        drawArm(latestState);
    </script>
</body>
</html>
